<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finger Fruit Slice</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }
    #webcam {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 200px;
      height: 150px;
      object-fit: cover;
      border: 2px solid #333;
      border-radius: 8px;
      opacity: 0.35;
      transform: scaleX(-1);
      z-index: 5;
      pointer-events: none;
    }
    #tracking-status {
      position: absolute;
      bottom: 168px;
      right: 12px;
      font-size: 0.75rem;
      color: #666;
      z-index: 5;
      text-align: right;
    }
    #tracking-status.detected { color: #4ade80; }
    #hud {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0 24px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-left, .hud-right { display: flex; flex-direction: column; gap: 4px; }
    .hud-item {
      font-size: 1.35rem;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }
    .hud-sub { font-size: 0.85rem; color: #888; font-weight: 500; }
    #score { color: #4ade80; }
    #lives { color: #f87171; text-align: right; }
    #combo { color: #fbbf24; text-align: center; font-size: 1.6rem; }
    #combo-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    #combo-bar-wrap {
      width: 120px;
      height: 6px;
      background: #222;
      border-radius: 3px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #combo-bar-wrap.active { opacity: 1; }
    #combo-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #fbbf24, #f97316);
      border-radius: 3px;
      transform-origin: left;
      transform: scaleX(1);
    }
    #powerups { font-size: 0.9rem; color: #a78bfa; text-align: center; min-height: 1.2em; }
    #countdown {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 17;
      font-size: 8rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 40px rgba(249,115,22,0.8);
      pointer-events: none;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    #overlay h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #f97316, #ef4444, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #overlay p {
      color: #aaa;
      margin-bottom: 8px;
      max-width: 460px;
      line-height: 1.5;
    }
    #start-btn {
      margin-top: 24px;
      padding: 14px 40px;
      font-size: 1.2rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: #fff;
      transition: transform 0.15s, box-shadow 0.15s;
      pointer-events: auto;
    }
    #start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(249,115,22,0.5);
    }
    #status {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #666;
    }
    .overlay-best {
      color: #4ade80 !important;
      font-size: 1.1rem !important;
      font-weight: 600;
      margin-top: 12px !important;
    }
    .hidden { display: none !important; }
    #game-controls {
      position: absolute;
      bottom: 12px;
      left: 12px;
      z-index: 10;
      display: flex;
      gap: 8px;
    }
    .ctrl-btn {
      pointer-events: auto;
      background: rgba(255,255,255,0.08);
      border: 1px solid #333;
      color: #aaa;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-family: inherit;
      transition: background 0.15s;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
    #cam-btn { min-width: 100px; }
    #pause-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      z-index: 18;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: #fff;
      pointer-events: none;
    }
    #finger-dot {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 30%, rgba(255,255,255,0.3) 70%);
      box-shadow: 0 0 15px #fff, 0 0 30px #f97316;
      pointer-events: none;
      z-index: 15;
      transform: translate(-50%, -50%);
      display: none;
    }
    #credit {
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 25;
      font-size: 0.75rem;
      color: #555;
      pointer-events: auto;
    }
    #credit a {
      color: #888;
      text-decoration: none;
      transition: color 0.15s;
    }
    #credit a:hover { color: #f472b6; }
  </style>
</head>
<body>
  <div id="game-container">
    <video id="webcam" playsinline muted autoplay></video>
    <canvas id="game-canvas"></canvas>
    <div id="tracking-status">Hand: not detected</div>
    <div id="finger-dot"></div>
    <div id="game-controls" class="hidden">
      <button class="ctrl-btn" id="pause-btn">⏸ Pause</button>
      <button class="ctrl-btn" id="mute-btn">🔊 Sound</button>
      <button class="ctrl-btn" id="cam-btn">📷 Cam</button>
    </div>
    <div id="pause-overlay" class="hidden">PAUSED</div>
    <div id="countdown" class="hidden"></div>
    <div id="hud" class="hidden">
      <div class="hud-left">
        <div class="hud-item" id="score">0</div>
        <div class="hud-sub" id="best-score">Best: 0</div>
        <div class="hud-sub" id="difficulty">Level: Easy</div>
      </div>
      <div id="combo-wrap">
        <div class="hud-item" id="combo"></div>
        <div id="combo-bar-wrap"><div id="combo-bar"></div></div>
        <div id="powerups"></div>
      </div>
      <div class="hud-right">
        <div class="hud-item" id="lives">❤️ ❤️ ❤️</div>
        <div class="hud-sub">💣 bombs cost a life</div>
      </div>
    </div>
    <div id="overlay">
      <h1>Finger Fruit Slice</h1>
      <p>Use your <strong>index finger</strong> to slice fruits and earn points!</p>
      <p>★ Slice purple power-ups for bonuses · Press P to pause</p>
      <p id="overlay-stats" class="hud-sub" style="margin-top:8px"></p>
      <p id="overlay-best" class="overlay-best">Best Score: 0</p>
      <button id="start-btn">Start Game</button>
      <div id="status">Loading hand tracking...</div>
    </div>
    <div id="credit">
      Made by <a href="https://www.instagram.com/code_with_aavi/" target="_blank" rel="noopener noreferrer">@code_with_aavi</a>
    </div>
  </div>

  <script type="module">
    import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21';

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('webcam');
    const fingerDot = document.getElementById('finger-dot');
    const overlay = document.getElementById('overlay');
    const hud = document.getElementById('hud');
    const startBtn = document.getElementById('start-btn');
    const statusEl = document.getElementById('status');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const comboEl = document.getElementById('combo');
    const comboBarWrap = document.getElementById('combo-bar-wrap');
    const comboBar = document.getElementById('combo-bar');
    const powerupsEl = document.getElementById('powerups');
    const countdownEl = document.getElementById('countdown');
    const overlayStatsEl = document.getElementById('overlay-stats');
    const bestScoreEl = document.getElementById('best-score');
    const difficultyEl = document.getElementById('difficulty');
    const trackingStatusEl = document.getElementById('tracking-status');
    const overlayBestEl = document.getElementById('overlay-best');
    const pauseBtn = document.getElementById('pause-btn');
    const muteBtn = document.getElementById('mute-btn');
    const camBtn = document.getElementById('cam-btn');
    const pauseOverlay = document.getElementById('pause-overlay');
    const gameControls = document.getElementById('game-controls');

    const BEST_KEY = 'fingerFruitSlice_best';
    const STATS_KEY = 'fingerFruitSlice_stats';
    const COMBO_MAX_FRAMES = 90;
    const OVERLAY_DEFAULT = {
      title: 'Finger Fruit Slice',
      line1: 'Use your <strong>index finger</strong> to slice fruits and earn points!',
      line2: '★ Golden fruits = 50 pts · 💣 bombs cost a life · Speed ramps with score.',
      btn: 'Start Game',
    };

    // Web Audio — no external files needed
    const sfx = {
      ctx: null,
      muted: false,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      play(freq, dur, type = 'sine', vol = 0.1) {
        if (this.muted || !this.ctx) return;
        try {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = type;
          o.frequency.value = freq;
          g.gain.setValueAtTime(vol, this.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
          o.connect(g);
          g.connect(this.ctx.destination);
          o.start();
          o.stop(this.ctx.currentTime + dur);
        } catch { /* ignore */ }
      },
      slice() { this.play(520 + Math.random() * 120, 0.07, 'triangle', 0.07); },
      boom() { this.play(90, 0.35, 'sawtooth', 0.14); this.play(55, 0.4, 'square', 0.08); },
      combo() { this.play(740, 0.12, 'sine', 0.07); },
      golden() { this.play(980, 0.15, 'sine', 0.09); this.play(1230, 0.2, 'triangle', 0.06); },
      record() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.play(f, 0.2, 'sine', 0.08), i * 90)); },
      powerup() { this.play(660, 0.1, 'sine', 0.07); this.play(880, 0.15, 'triangle', 0.06); },
      levelup() { this.play(392, 0.12, 'sine', 0.07); setTimeout(() => this.play(523, 0.18, 'sine', 0.08), 100); },
    };

    let paused = false;
    let camVisible = true;
    let fruitsSliced = 0;
    let maxCombo = 0;
    let bombsHit = 0;
    let callouts = [];
    let stars = [];
    let mouseDown = false;
    let mousePos = null;
    let hasShield = false;
    let slowMoTimer = 0;
    let doubleTimer = 0;
    let countdown = 0;
    let lastPhase = 'Easy';
    let levelUpFlash = 0;
    let stats = loadStats();
    let pendingSpawn = false;

    function loadStats() {
      try {
        const raw = JSON.parse(localStorage.getItem(STATS_KEY) || '{}');
        return {
          games: raw.games || 0,
          totalFruits: raw.totalFruits || 0,
          totalScore: raw.totalScore || 0,
        };
      } catch {
        return { games: 0, totalFruits: 0, totalScore: 0 };
      }
    }

    function saveStats() {
      try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch { /* ignore */ }
    }

    function refreshOverlayStats() {
      if (!overlayStatsEl) return;
      overlayStatsEl.textContent = `Games: ${stats.games} · Lifetime slices: ${stats.totalFruits.toLocaleString()}`;
    }

    function loadBestScore() {
      try {
        let stored = localStorage.getItem(BEST_KEY) ?? sessionStorage.getItem(BEST_KEY);
        if (!stored) {
          const legacy = localStorage.getItem('fruitSliceBest');
          if (legacy) {
            stored = legacy;
            saveBestScore(parseInt(legacy, 10) || 0);
          }
        }
        const n = parseInt(stored, 10);
        return Number.isFinite(n) && n >= 0 ? n : 0;
      } catch {
        return 0;
      }
    }

    function saveBestScore(value) {
      const v = String(Math.max(0, value));
      try { localStorage.setItem(BEST_KEY, v); } catch { /* private mode */ }
      try { sessionStorage.setItem(BEST_KEY, v); } catch { /* ignore */ }
    }

    function updateBestScore(current) {
      if (current > bestScore) {
        bestScore = current;
        saveBestScore(bestScore);
      }
      refreshBestScoreUI();
    }

    function refreshBestScoreUI() {
      const text = bestScore.toLocaleString();
      bestScoreEl.textContent = `Best: ${text}`;
      if (overlayBestEl) overlayBestEl.textContent = `Best Score: ${text}`;
    }

    let W, H;
    let handLandmarker = null;
    let gameRunning = false;
    let score = 0;
    let bestScore = loadBestScore();
    let lives = 3;
    let combo = 0;
    let comboTimer = 0;
    let screenShake = 0;

    let fingerPos = null;
    let prevFingerPos = null;
    let fingerTrail = [];
    const MAX_TRAIL = 20;

    const fingerState = {
      x: 0, y: 0, vx: 0, vy: 0,
      active: false,
      lastUpdate: 0,
      lostFrames: 0,

      feed(screenPos) {
        const now = performance.now();
        const nx = screenPos.x;
        const ny = screenPos.y;
        if (this.active && this.lastUpdate) {
          const dt = (now - this.lastUpdate) / 1000;
          if (dt > 0 && dt < 0.25) {
            this.vx = lerp(this.vx, (nx - this.x) / dt, 0.5);
            this.vy = lerp(this.vy, (ny - this.y) / dt, 0.5);
          }
        }
        if (this.active) {
          this.x = lerp(this.x, nx, 0.9);
          this.y = lerp(this.y, ny, 0.9);
        } else {
          this.x = nx;
          this.y = ny;
          this.vx = this.vy = 0;
        }
        this.active = true;
        this.lostFrames = 0;
        this.lastUpdate = now;
      },

      markLost() {
        this.lostFrames++;
        if (this.lostFrames > 5) {
          this.active = false;
          this.vx = this.vy = 0;
        }
      },

      getPos(now) {
        if (!this.active) return null;
        const elapsed = (now - this.lastUpdate) / 1000;
        if (elapsed > 0.18) {
          this.active = false;
          return null;
        }
        const lead = Math.min(elapsed, 0.04);
        return {
          x: this.x + this.vx * lead,
          y: this.y + this.vy * lead,
        };
      },

      reset() {
        this.active = false;
        this.vx = this.vy = 0;
        this.lostFrames = 0;
      },
    };

    function landmarkToScreen(lm) {
      const vw = video.videoWidth || 640;
      const vh = video.videoHeight || 480;
      const mirroredX = 1 - lm.x;
      const videoAspect = vw / vh;
      const screenAspect = W / H;
      let scale, offsetX = 0, offsetY = 0;
      if (videoAspect > screenAspect) {
        scale = H / vh;
        offsetX = (W - vw * scale) / 2;
      } else {
        scale = W / vw;
        offsetY = (H - vh * scale) / 2;
      }
      return {
        x: mirroredX * vw * scale + offsetX,
        y: lm.y * vh * scale + offsetY,
      };
    }

    function isIndexExtended(lm) {
      const tip = lm[8];
      const pip = lm[6];
      const mcp = lm[5];
      const midTip = lm[12];
      const indexLen = Math.hypot(tip.x - pip.x, tip.y - pip.y);
      if (indexLen < 0.038) return false;
      const indexReach = Math.hypot(tip.x - mcp.x, tip.y - mcp.y);
      const awayFromMiddle = Math.hypot(midTip.x - tip.x, midTip.y - tip.y);
      return indexReach > 0.1 && awayFromMiddle > 0.025;
    }

    function getIndexPointer(lm) {
      if (!isIndexExtended(lm)) return null;
      return landmarkToScreen(lm[8]);
    }

    function runHandDetection(now) {
      if (!handLandmarker || video.readyState < 2 || video.videoWidth === 0) return;
      const results = handLandmarker.detectForVideo(video, now);
      if (results.landmarks && results.landmarks.length > 0) {
        const ptr = getIndexPointer(results.landmarks[0]);
        if (ptr) fingerState.feed(ptr);
        else fingerState.markLost();
      } else {
        fingerState.markLost();
      }
    }
    let slashEffects = [];
    let lastFrameTime = performance.now();

    const FRUITS = [
      { name: 'apple', points: 10, colors: ['#c0392b', '#e74c3c', '#922b21'], stem: '#5d4037' },
      { name: 'orange', points: 15, colors: ['#e67e22', '#f39c12', '#d35400'], stem: '#2ecc71' },
      { name: 'lemon', points: 12, colors: ['#f1c40f', '#f9e79f', '#d4ac0d'], stem: '#27ae60' },
      { name: 'watermelon', points: 25, colors: ['#27ae60', '#2ecc71', '#1e8449'], inner: '#e74c3c' },
      { name: 'grape', points: 20, colors: ['#8e44ad', '#9b59b6', '#6c3483'], stem: '#2ecc71' },
      { name: 'banana', points: 18, colors: ['#f4d03f', '#f9e076', '#d4ac0d'], stem: '#8b6914' },
      { name: 'strawberry', points: 22, colors: ['#e74c3c', '#ff6b6b', '#c0392b'], stem: '#27ae60' },
    ];

    let entities = [];
    let particles = [];
    let scorePops = [];
    let spawnTimer = 0;
    let spawnInterval = 78;

    function lerp(a, b, t) { return a + (b - a) * t; }

    function getDifficulty() {
      const s = score;
      const t = Math.min(1, s / 1800);
      let phase, phaseColor;

      if (s < 250) {
        phase = 'Easy';
        phaseColor = '#4ade80';
      } else if (s < 600) {
        phase = 'Medium';
        phaseColor = '#fbbf24';
      } else if (s < 1200) {
        phase = 'Hard';
        phaseColor = '#f97316';
      } else {
        phase = 'Insane';
        phaseColor = '#ef4444';
      }

      return {
        phase,
        phaseColor,
        vyMin: lerp(1.0, 2.6, t),
        vyMax: lerp(1.7, 3.8, t),
        gravity: lerp(0.028, 0.048, t),
        drift: lerp(1.2, 2.4, t),
        spawnInterval: Math.round(lerp(78, 42, t)),
        extraChance: lerp(0.05, 0.3, t),
        tripleChance: s < 400 ? 0 : lerp(0, 0.18, Math.min(1, (s - 400) / 1200)),
        bombChance: lerp(0.06, 0.16, t),
      };
    }

    function getSpeedMult() {
      return slowMoTimer > 0 ? 0.5 : 1;
    }

    function applyPowerUp(type) {
      sfx.powerup();
      if (type === 'shield') {
        hasShield = true;
        addCallout('SHIELD!', '#60a5fa');
      } else if (type === 'slowmo') {
        slowMoTimer = 420;
        addCallout('SLOW-MO!', '#a78bfa');
      } else if (type === 'double') {
        doubleTimer = 540;
        addCallout('2x POINTS!', '#f472b6');
      }
    }

    function drawPowerUp(entity) {
      const { x, y, radius: r, rotation, pulse, powerType } = entity;
      const icons = { shield: '🛡️', slowmo: '⏱️', double: '✖️2' };
      const colors = {
        shield: ['#3b82f6', '#60a5fa', '#1d4ed8'],
        slowmo: ['#8b5cf6', '#a78bfa', '#6d28d9'],
        double: ['#ec4899', '#f472b6', '#be185d'],
      };
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      const c = colors[powerType];
      const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, 0, 0, 0, r);
      grad.addColorStop(0, c[1]);
      grad.addColorStop(1, c[2]);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.4 + Math.sin(pulse) * 0.2;
      ctx.strokeStyle = c[0];
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.font = `${r * 1.1}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(icons[powerType], 0, 2);
      ctx.restore();
    }

    function spawnWave() {
      const d = getDifficulty();
      spawnEntity(d);
      if (Math.random() < d.extraChance) spawnEntity(d);
      if (Math.random() < d.tripleChance) spawnEntity(d);
    }

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      if (stars.length) initStars();
    }
    window.addEventListener('resize', resize);
    resize();

    function initStars() {
      stars = Array.from({ length: 80 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        speed: Math.random() * 0.3 + 0.1,
        alpha: Math.random() * 0.5 + 0.2,
      }));
    }
    initStars();

    function drawBackground(dt) {
      if (levelUpFlash > 0) {
        ctx.fillStyle = `rgba(249,115,22,${levelUpFlash * 0.12})`;
        levelUpFlash -= 0.03 * dt;
        if (levelUpFlash < 0) levelUpFlash = 0;
      } else {
        ctx.fillStyle = '#000';
      }
      ctx.fillRect(-20, -20, W + 40, H + 40);
      stars.forEach(s => {
        s.y += s.speed * dt;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function addCallout(text, color = '#fbbf24') {
      callouts.push({ text, color, life: 1, scale: 1.4 });
    }

    function getPointerPos() {
      if (fingerPos) return { ...fingerPos };
      if (mouseDown && mousePos) return { ...mousePos };
      return null;
    }

    canvas.addEventListener('pointerdown', (e) => {
      sfx.init();
      mouseDown = true;
      const r = canvas.getBoundingClientRect();
      mousePos = {
        x: (e.clientX - r.left) * (W / r.width),
        y: (e.clientY - r.top) * (H / r.height),
      };
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!mouseDown) return;
      const r = canvas.getBoundingClientRect();
      mousePos = {
        x: (e.clientX - r.left) * (W / r.width),
        y: (e.clientY - r.top) * (H / r.height),
      };
    });
    canvas.addEventListener('pointerup', () => { mouseDown = false; mousePos = null; });
    canvas.addEventListener('pointerleave', () => { mouseDown = false; });

    pauseBtn.addEventListener('click', () => togglePause());
    muteBtn.addEventListener('click', () => {
      sfx.muted = !sfx.muted;
      muteBtn.textContent = sfx.muted ? '🔇 Muted' : '🔊 Sound';
    });
    camBtn.addEventListener('click', () => toggleCam());
    window.addEventListener('keydown', (e) => {
      if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
    });

    function togglePause() {
      if (!gameRunning || countdown > 0) return;
      paused = !paused;
      pauseOverlay.classList.toggle('hidden', !paused);
      pauseBtn.textContent = paused ? '▶ Resume' : '⏸ Pause';
    }

    function toggleCam() {
      camVisible = !camVisible;
      video.style.opacity = camVisible ? '0.35' : '0';
      trackingStatusEl.style.opacity = camVisible ? '1' : '0';
      camBtn.textContent = camVisible ? '📷 Cam' : '📷 Off';
      sfx.play(480, 0.06, 'sine', 0.05);
    }

    function startVideoTracking() {
      if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
        const onFrame = (t) => {
          runHandDetection(t);
          video.requestVideoFrameCallback(onFrame);
        };
        video.requestVideoFrameCallback(onFrame);
      } else {
        let lastT = -1;
        const poll = () => {
          if (video.currentTime !== lastT) {
            lastT = video.currentTime;
            runHandDetection(performance.now());
          }
          requestAnimationFrame(poll);
        };
        poll();
      }
    }

    function drawGlossySphere(x, y, r, colors, rotation) {
      const grad = ctx.createRadialGradient(
        x - r * 0.35, y - r * 0.35, r * 0.05,
        x, y, r
      );
      grad.addColorStop(0, colors[1]);
      grad.addColorStop(0.55, colors[0]);
      grad.addColorStop(1, colors[2]);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath();
      ctx.ellipse(-r * 0.25, -r * 0.3, r * 0.28, r * 0.18, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawFruitShape(entity) {
      const { x, y, radius: r, rotation, type } = entity;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);

      if (type.name === 'banana') {
        ctx.fillStyle = type.colors[0];
        ctx.beginPath();
        ctx.moveTo(-r * 0.2, -r * 0.8);
        ctx.quadraticCurveTo(r * 0.9, -r * 0.3, r * 0.5, r * 0.7);
        ctx.quadraticCurveTo(0, r * 0.9, -r * 0.4, r * 0.5);
        ctx.quadraticCurveTo(-r * 0.8, 0, -r * 0.2, -r * 0.8);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath();
        ctx.ellipse(-r * 0.1, -r * 0.2, r * 0.15, r * 0.35, -0.3, 0, Math.PI * 2);
        ctx.fill();
      } else if (type.name === 'watermelon') {
        drawGlossySphere(0, 0, r, type.colors, 0);
        ctx.fillStyle = type.inner;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.72, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7);
          ctx.stroke();
        }
      } else if (type.name === 'strawberry') {
        ctx.fillStyle = type.colors[0];
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.85);
        ctx.bezierCurveTo(r, -r * 0.3, r * 0.8, r * 0.7, 0, r);
        ctx.bezierCurveTo(-r * 0.8, r * 0.7, -r, -r * 0.3, 0, -r * 0.85);
        ctx.fill();
        ctx.fillStyle = '#f9e79f';
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2;
          const d = r * (0.2 + (i % 3) * 0.08);
          ctx.beginPath();
          ctx.arc(Math.cos(a) * d, Math.sin(a) * d + r * 0.1, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = type.stem;
        ctx.beginPath();
        ctx.ellipse(0, -r * 0.85, r * 0.35, r * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.ellipse(-r * 0.15, -r * 0.2, r * 0.12, r * 0.25, -0.3, 0, Math.PI * 2);
        ctx.fill();
      } else if (type.name === 'grape') {
        const cols = 3, rows = 4;
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const ox = (col - 1) * r * 0.38 + (row % 2) * r * 0.18;
            const oy = (row - 1.5) * r * 0.38;
            const gr = r * 0.28;
            drawGlossySphere(ox, oy, gr, type.colors, 0);
          }
        }
        ctx.strokeStyle = type.stem;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.85);
        ctx.quadraticCurveTo(r * 0.3, -r * 0.5, 0, -r * 0.2);
        ctx.stroke();
      } else {
        drawGlossySphere(0, 0, r, type.colors, 0);
        if (type.stem) {
          ctx.fillStyle = type.stem;
          ctx.fillRect(-r * 0.06, -r * 1.05, r * 0.12, r * 0.25);
        }
      }

      ctx.restore();
    }

    function drawBomb(entity) {
      const { x, y, radius: r, rotation, pulse } = entity;
      const glow = 0.4 + Math.sin(pulse) * 0.2;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);

      const outer = ctx.createRadialGradient(0, 0, r * 0.3, 0, 0, r * 1.4);
      outer.addColorStop(0, `rgba(239,68,68,${glow * 0.3})`);
      outer.addColorStop(1, 'rgba(239,68,68,0)');
      ctx.fillStyle = outer;
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.4, 0, Math.PI * 2);
      ctx.fill();

      const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, 0, 0, 0, r);
      grad.addColorStop(0, '#4b5563');
      grad.addColorStop(0.5, '#1f2937');
      grad.addColorStop(1, '#111827');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath();
      ctx.ellipse(-r * 0.25, -r * 0.3, r * 0.2, r * 0.12, -0.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.quadraticCurveTo(r * 0.4, -r * 1.5, r * 0.2, -r * 1.8);
      ctx.stroke();

      const spark = Math.sin(pulse * 3) > 0.5;
      if (spark) {
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(r * 0.2, -r * 1.8, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(r * 0.2, -r * 1.8, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#ef4444';
      ctx.font = `bold ${r * 0.9}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('💣', 0, 2);

      ctx.restore();
    }

    class Entity {
      constructor(diff, isBomb = false, isPowerUp = false, powerType = null) {
        this.isBomb = isBomb;
        this.isPowerUp = isPowerUp;
        this.powerType = powerType;
        this.gravity = diff.gravity;
        this.radius = isBomb ? 32 + Math.random() * 8 : isPowerUp ? 30 : 36 + Math.random() * 14;
        this.x = this.radius + Math.random() * (W - this.radius * 2);
        this.y = -this.radius - 30;
        this.vx = (Math.random() - 0.5) * diff.drift;
        this.vy = diff.vyMin + Math.random() * (diff.vyMax - diff.vyMin);
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.06;
        this.alive = true;
        this.sliced = false;
        this.halves = null;
        this.pulse = Math.random() * Math.PI * 2;
        this.isGolden = false;

        if (!isBomb && !isPowerUp) {
          this.type = FRUITS[Math.floor(Math.random() * FRUITS.length)];
          this.points = this.type.points;
          this.isGolden = Math.random() < 0.07;
          if (this.isGolden) this.points = 50;
        }
      }

      update(dt) {
        const spd = getSpeedMult();
        const d = dt * spd;
        this.pulse += 0.12 * dt;
        if (this.sliced && this.halves) {
          this.halves.forEach(h => {
            h.x += h.vx * d;
            h.y += h.vy * d;
            h.vy += 0.55 * d;
            h.rotation += h.rotSpeed * d;
            h.alpha -= 0.065 * dt;
          });
          return;
        }
        this.x += this.vx * d;
        this.y += this.vy * d;
        this.vy += this.gravity * d;
        this.rotation += this.rotSpeed * d;
        if (this.x < this.radius || this.x > W - this.radius) this.vx *= -0.85;
      }

      draw() {
        if (this.sliced && this.halves) {
          this.halves.forEach(h => {
            if (h.alpha <= 0) return;
            ctx.save();
            ctx.globalAlpha = h.alpha;
            ctx.translate(h.x, h.y);
            ctx.rotate(h.rotation);
            if (this.isBomb) {
              const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius);
              grad.addColorStop(0, '#6b7280');
              grad.addColorStop(1, '#1f2937');
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(0, 0, this.radius, h.startAngle, h.endAngle);
              ctx.closePath();
              ctx.fill();
            } else if (this.isPowerUp) {
              const powerColors = {
                shield: ['#3b82f6', '#60a5fa', '#1d4ed8'],
                slowmo: ['#8b5cf6', '#a78bfa', '#6d28d9'],
                double: ['#ec4899', '#f472b6', '#be185d'],
              };
              const c = powerColors[this.powerType] || powerColors.shield;
              const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius);
              grad.addColorStop(0, c[1]);
              grad.addColorStop(1, c[2]);
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(0, 0, this.radius, h.startAngle, h.endAngle);
              ctx.closePath();
              ctx.fill();
            } else {
              const grad = ctx.createRadialGradient(-this.radius * 0.2, -this.radius * 0.2, 0, 0, 0, this.radius);
              grad.addColorStop(0, this.type.colors[1]);
              grad.addColorStop(0.6, this.type.colors[0]);
              grad.addColorStop(1, this.type.colors[2]);
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(0, 0, this.radius, h.startAngle, h.endAngle);
              ctx.closePath();
              ctx.fill();
              ctx.fillStyle = this.type.inner || this.type.colors[1] || '#ffeaa7';
              ctx.beginPath();
              ctx.arc(0, 0, this.radius * 0.55, h.startAngle, h.endAngle);
              ctx.closePath();
              ctx.fill();
              ctx.strokeStyle = 'rgba(255,255,255,0.5)';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(Math.cos(h.startAngle) * this.radius * 0.2, Math.sin(h.startAngle) * this.radius * 0.2);
              ctx.lineTo(Math.cos(h.startAngle) * this.radius, Math.sin(h.startAngle) * this.radius);
              ctx.stroke();
            }
            ctx.restore();
          });
          return;
        }
        if (this.isBomb) drawBomb(this);
        else if (this.isPowerUp) drawPowerUp(this);
        else {
          if (this.isGolden && !this.sliced) {
            ctx.save();
            ctx.globalAlpha = 0.35 + Math.sin(this.pulse) * 0.15;
            const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 1.6);
            g.addColorStop(0, '#fbbf24');
            g.addColorStop(1, 'rgba(251,191,36,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius * 1.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
          drawFruitShape(this);
          if (this.isGolden && !this.sliced) {
            ctx.save();
            ctx.font = `bold ${this.radius * 0.45}px sans-serif`;
            ctx.fillStyle = '#fbbf24';
            ctx.textAlign = 'center';
            ctx.fillText('★', this.x, this.y - this.radius - 6);
            ctx.restore();
          }
        }
      }

      isOffScreen() {
        if (this.sliced && this.halves) {
          return this.halves.every(h => h.alpha <= 0 || h.y > H + 80);
        }
        return this.y > H + this.radius + 20;
      }

      slice(cutAngle, swipePower = 14) {
        if (this.sliced) return false;
        this.sliced = true;
        const half = Math.PI;
        const p = Math.max(12, Math.min(28, swipePower));
        const lift = p * 0.55;
        this.halves = [
          { x: this.x, y: this.y, vx: Math.cos(cutAngle) * p, vy: Math.sin(cutAngle) * p - lift, rotation: this.rotation, rotSpeed: -0.35, alpha: 1, startAngle: cutAngle - half / 2, endAngle: cutAngle + half / 2 },
          { x: this.x, y: this.y, vx: Math.cos(cutAngle + Math.PI) * p, vy: Math.sin(cutAngle + Math.PI) * p - lift, rotation: this.rotation, rotSpeed: 0.35, alpha: 1, startAngle: cutAngle + half / 2, endAngle: cutAngle + half / 2 + Math.PI },
        ];
        return true;
      }
    }

    function spawnEntity(diff) {
      const d = diff || getDifficulty();
      const roll = Math.random();
      if (roll < d.bombChance) {
        entities.push(new Entity(d, true));
      } else if (roll < d.bombChance + 0.045) {
        const types = ['shield', 'slowmo', 'double'];
        const powerType = types[Math.floor(Math.random() * types.length)];
        entities.push(new Entity(d, false, true, powerType));
      } else {
        entities.push(new Entity(d, false));
      }
    }

    function spawnJuice(x, y, color, count = 22) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 5 + Math.random() * 12;
        particles.push({
          x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          life: 1, color, size: 3 + Math.random() * 6, gravity: 0.35,
        });
      }
    }

    function spawnExplosion(x, y) {
      for (let i = 0; i < 40; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 6 + Math.random() * 14;
        const colors = ['#ef4444', '#f97316', '#fbbf24', '#fff', '#6b7280'];
        particles.push({
          x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          life: 1, color: colors[Math.floor(Math.random() * colors.length)],
          size: 4 + Math.random() * 9, gravity: 0.25,
        });
      }
    }

    function addSlash(x1, y1, x2, y2) {
      slashEffects.push({ x1, y1, x2, y2, life: 1 });
    }

    function addScorePop(x, y, text, color = '#4ade80') {
      scorePops.push({ x, y, text, color, life: 1, vy: -5 });
    }

    function getComboMultiplier() {
      if (combo >= 10) return 3;
      if (combo >= 6) return 2.5;
      if (combo >= 4) return 2;
      if (combo >= 2) return 1.5;
      return 1;
    }

    function lineIntersectsCircle(x1, y1, x2, y2, cx, cy, r) {
      const dx = x2 - x1, dy = y2 - y1;
      const len2 = dx * dx + dy * dy;
      if (len2 === 0) return Math.hypot(cx - x1, cy - y1) < r + 8;
      let t = ((cx - x1) * dx + (cy - y1) * dy) / len2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(cx - (x1 + t * dx), cy - (y1 + t * dy)) < r + 10;
    }

    function checkCuts(current) {
      if (!current || !prevFingerPos) return;
      const swipeDist = Math.hypot(current.x - prevFingerPos.x, current.y - prevFingerPos.y);
      const swipePower = 10 + swipeDist * 0.55;
      const steps = Math.max(4, Math.min(12, Math.ceil(swipeDist / 15)));
      const hitSet = new Set();

      for (let s = 1; s <= steps; s++) {
        const t0 = (s - 1) / steps;
        const t1 = s / steps;
        const x1 = lerp(prevFingerPos.x, current.x, t0);
        const y1 = lerp(prevFingerPos.y, current.y, t0);
        const x2 = lerp(prevFingerPos.x, current.x, t1);
        const y2 = lerp(prevFingerPos.y, current.y, t1);
        const cutAngle = Math.atan2(y2 - y1, x2 - x1);

        for (const entity of entities) {
          if (!entity.alive || entity.sliced || hitSet.has(entity)) continue;
          if (!lineIntersectsCircle(x1, y1, x2, y2, entity.x, entity.y, entity.radius)) continue;

          hitSet.add(entity);
          addSlash(x1, y1, x2, y2);

          if (entity.isBomb) {
            entity.slice(cutAngle, swipePower);
            if (hasShield) {
              hasShield = false;
              spawnExplosion(entity.x, entity.y);
              screenShake = 12;
              sfx.play(220, 0.15, 'triangle', 0.08);
              addCallout('BLOCKED!', '#60a5fa');
              addScorePop(entity.x, entity.y - 30, 'SHIELD!', '#60a5fa');
            } else {
              spawnExplosion(entity.x, entity.y);
              screenShake = 22;
              lives--;
              bombsHit++;
              combo = 0;
              comboTimer = 0;
              sfx.boom();
              addScorePop(entity.x, entity.y - 30, 'BOOM!', '#ef4444');
              if (lives <= 0) endGame();
            }
          } else if (entity.isPowerUp) {
            entity.slice(cutAngle, swipePower);
            spawnJuice(entity.x, entity.y, '#a78bfa', 14);
            applyPowerUp(entity.powerType);
            addScorePop(entity.x, entity.y - 20, entity.powerType === 'shield' ? '🛡️' : entity.powerType === 'slowmo' ? '⏱️' : '2x', '#a78bfa');
          } else {
            entity.slice(cutAngle, swipePower);
            spawnJuice(entity.x, entity.y, entity.isGolden ? '#fbbf24' : entity.type.colors[0]);
            combo++;
            comboTimer = COMBO_MAX_FRAMES;
            maxCombo = Math.max(maxCombo, combo);
            fruitsSliced++;
            if (entity.isGolden) sfx.golden();
            else sfx.slice();
            if (combo === 5) addCallout('NICE!');
            else if (combo === 10) addCallout('AMAZING!');
            else if (combo === 20) addCallout('UNSTOPPABLE!', '#f97316');
            else if (combo >= 3 && combo % 5 === 0) { addCallout(`x${combo}!`); sfx.combo(); }
            const mult = getComboMultiplier();
            const doubleMult = doubleTimer > 0 ? 2 : 1;
            const earned = Math.round(entity.points * mult * doubleMult);
            score += earned;
            updateBestScore(score);
            addScorePop(entity.x, entity.y - 20, `+${earned}`, entity.isGolden ? '#fbbf24' : mult > 1 ? '#fbbf24' : '#4ade80');
          }
        }
      }
      if (hitSet.size > 0) updateHUD();
    }

    function updateHUD() {
      scoreEl.textContent = score.toLocaleString();
      bestScoreEl.textContent = `Best: ${bestScore.toLocaleString()}`;
      const d = getDifficulty();
      if (d.phase !== lastPhase && gameRunning && countdown <= 0 && score > 0) {
        lastPhase = d.phase;
        levelUpFlash = 1;
        addCallout(`${d.phase.toUpperCase()}!`, d.phaseColor);
        sfx.levelup();
      }
      difficultyEl.textContent = `Level: ${d.phase}`;
      difficultyEl.style.color = d.phaseColor;
      const hearts = (hasShield ? '🛡️ ' : '') + ('❤️ '.repeat(Math.max(0, lives)).trim() || (hasShield ? '' : '💀'));
      livesEl.textContent = hearts.trim() || '💀';
      const mult = getComboMultiplier();
      if (combo >= 2) {
        comboEl.textContent = `🔥 x${mult} (${combo})`;
        comboBarWrap.classList.add('active');
        comboBar.style.transform = `scaleX(${Math.max(0, comboTimer / COMBO_MAX_FRAMES)})`;
      } else {
        comboEl.textContent = '';
        comboBarWrap.classList.remove('active');
      }
      const perks = [];
      if (hasShield) perks.push('🛡️ Shield');
      if (slowMoTimer > 0) perks.push(`⏱️ ${Math.ceil(slowMoTimer / 60)}s`);
      if (doubleTimer > 0) perks.push(`2x ${Math.ceil(doubleTimer / 60)}s`);
      powerupsEl.textContent = perks.join(' · ');
    }

    function drawSlashEffects() {
      slashEffects.forEach(s => {
        ctx.save();
        ctx.globalAlpha = s.life;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3 + (1 - s.life) * 4;
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 12;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.stroke();
        ctx.restore();
      });
    }

    function drawCallouts(dt) {
      callouts.forEach(c => {
        c.life -= 0.025 * dt;
        c.scale = 1 + (1 - c.life) * 0.3;
        ctx.save();
        ctx.globalAlpha = Math.min(1, c.life * 2);
        ctx.font = `bold ${Math.round(36 * c.scale)}px sans-serif`;
        ctx.fillStyle = c.color;
        ctx.textAlign = 'center';
        ctx.shadowColor = c.color;
        ctx.shadowBlur = 16;
        ctx.fillText(c.text, W / 2, H * 0.35);
        ctx.restore();
      });
      callouts = callouts.filter(c => c.life > 0);
    }

    function drawFingerTrail() {
      if (fingerTrail.length < 2) return;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let i = 1; i < fingerTrail.length; i++) {
        const t = i / fingerTrail.length;
        const p0 = fingerTrail[i - 1];
        const p1 = fingerTrail[i];
        ctx.beginPath();
        const r = 255, g = Math.round(180 + t * 75), b = Math.round(80 + t * 40);
        ctx.strokeStyle = `rgba(${r},${g},${b},${t * 0.85})`;
        ctx.lineWidth = 3 + t * 10;
        ctx.shadowColor = '#f97316';
        ctx.shadowBlur = 8;
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    function drawFingerGlow() {
      const pos = getPointerPos();
      if (!pos) return;
      const grad = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 40);
      grad.addColorStop(0, 'rgba(255,255,255,0.5)');
      grad.addColorStop(0.4, 'rgba(249,115,22,0.25)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 40, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    function updateFingerVisuals() {
      const pos = getPointerPos();
      if (pos) {
        fingerTrail.push({ ...pos });
        if (fingerTrail.length > MAX_TRAIL) fingerTrail.shift();
        fingerDot.style.display = 'block';
        fingerDot.style.left = pos.x + 'px';
        fingerDot.style.top = pos.y + 'px';
        if (fingerPos) {
          trackingStatusEl.textContent = 'Hand: detected';
          trackingStatusEl.classList.add('detected');
        } else {
          trackingStatusEl.textContent = 'Mouse: active';
          trackingStatusEl.classList.add('detected');
        }
      } else {
        fingerTrail = [];
        fingerDot.style.display = 'none';
        trackingStatusEl.textContent = 'Hand: not detected';
        trackingStatusEl.classList.remove('detected');
      }
    }

    function gameLoop(now) {
      const dt = Math.min((now - lastFrameTime) / 16.667, 2.5);
      lastFrameTime = now;

      fingerPos = fingerState.getPos(now);

      if (screenShake > 0) {
        const sx = (Math.random() - 0.5) * screenShake;
        const sy = (Math.random() - 0.5) * screenShake;
        ctx.setTransform(1, 0, 0, 1, sx, sy);
        screenShake *= Math.pow(0.82, dt);
        if (screenShake < 0.5) screenShake = 0;
      } else {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }

      drawBackground(dt);

      const currentFinger = getPointerPos();
      updateFingerVisuals();

      if (gameRunning && !paused && countdown <= 0) {
        checkCuts(currentFinger);
        prevFingerPos = currentFinger;

        spawnTimer += dt * getSpeedMult();
        if (spawnTimer >= spawnInterval) {
          spawnTimer = 0;
          spawnWave();
          spawnInterval = getDifficulty().spawnInterval;
        }

        entities.forEach(e => e.update(dt));
        entities = entities.filter(e => {
          if (!e.sliced && !e.isBomb && e.y > H + e.radius && e.alive) {
            return false;
          }
          return !e.isOffScreen();
        });

        particles.forEach(p => {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += p.gravity * dt;
          p.life -= 0.055 * dt;
        });
        particles = particles.filter(p => p.life > 0);

        scorePops.forEach(p => {
          p.y += p.vy * dt;
          p.vy *= Math.pow(0.98, dt);
          p.life -= 0.045 * dt;
        });
        scorePops = scorePops.filter(p => p.life > 0);

        slashEffects.forEach(s => { s.life -= 0.18 * dt; });
        slashEffects = slashEffects.filter(s => s.life > 0);

        if (comboTimer > 0) {
          comboTimer -= dt;
          if (comboTimer <= 0) combo = 0;
        }
        if (slowMoTimer > 0) slowMoTimer -= dt;
        if (doubleTimer > 0) doubleTimer -= dt;

        entities.forEach(e => e.draw());
        particles.forEach(p => {
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });
        scorePops.forEach(p => {
          ctx.globalAlpha = p.life;
          ctx.font = `bold ${20 + (1 - p.life) * 8}px sans-serif`;
          ctx.fillStyle = p.color;
          ctx.textAlign = 'center';
          ctx.fillText(p.text, p.x, p.y);
        });
        ctx.globalAlpha = 1;

        drawSlashEffects();
        drawCallouts(dt);
        updateHUD();
      } else if (gameRunning && paused) {
        drawCallouts(dt);
      }

      if (countdown > 0) {
        countdown -= dt;
        const num = Math.ceil(countdown / 60);
        countdownEl.textContent = num > 0 ? num : 'GO!';
        countdownEl.classList.remove('hidden');
      } else {
        countdownEl.classList.add('hidden');
        if (pendingSpawn) {
          spawnWave();
          pendingSpawn = false;
        }
      }

      drawFingerTrail();
      drawFingerGlow();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      sfx.init();
      score = 0;
      lives = 3;
      combo = 0;
      comboTimer = 0;
      fruitsSliced = 0;
      maxCombo = 0;
      bombsHit = 0;
      paused = false;
      hasShield = false;
      slowMoTimer = 0;
      doubleTimer = 0;
      countdown = 180;
      lastPhase = 'Easy';
      levelUpFlash = 0;
      pendingSpawn = true;
      entities = [];
      particles = [];
      scorePops = [];
      slashEffects = [];
      callouts = [];
      spawnTimer = 0;
      spawnInterval = getDifficulty().spawnInterval;
      screenShake = 0;
      prevFingerPos = null;
      fingerState.reset();
      lastFrameTime = performance.now();
      gameRunning = true;
      overlay.classList.add('hidden');
      hud.classList.remove('hidden');
      gameControls.classList.remove('hidden');
      pauseOverlay.classList.add('hidden');
      countdownEl.classList.remove('hidden');
      pauseBtn.textContent = '⏸ Pause';
      overlay.querySelector('h1').textContent = OVERLAY_DEFAULT.title;
      overlay.querySelector('p').textContent = OVERLAY_DEFAULT.line1;
      overlay.querySelectorAll('p')[1].textContent = OVERLAY_DEFAULT.line2;
      startBtn.textContent = OVERLAY_DEFAULT.btn;
      updateHUD();
    }

    function endGame() {
      gameRunning = false;
      countdown = 0;
      countdownEl.classList.add('hidden');
      const prevBest = bestScore;
      updateBestScore(score);
      const isNewRecord = score > prevBest && score > 0;
      if (isNewRecord) sfx.record();
      stats.games++;
      stats.totalFruits += fruitsSliced;
      stats.totalScore += score;
      saveStats();
      refreshOverlayStats();
      overlay.classList.remove('hidden');
      hud.classList.add('hidden');
      gameControls.classList.add('hidden');
      pauseOverlay.classList.add('hidden');
      overlay.querySelector('h1').textContent = isNewRecord ? '🏆 New Record!' : 'Game Over!';
      overlay.querySelector('p').textContent = `Score: ${score.toLocaleString()} · Best: ${bestScore.toLocaleString()}`;
      overlay.querySelectorAll('p')[1].textContent =
        `Sliced: ${fruitsSliced} · Max combo: ${maxCombo} · Bombs hit: ${bombsHit}`;
      startBtn.textContent = 'Play Again';
    }

    startBtn.addEventListener('click', () => { sfx.init(); startGame(); });
    refreshBestScoreUI();
    refreshOverlayStats();

    async function initTracking() {
      try {
        statusEl.textContent = 'Loading hand tracking model...';
        const vision = await FilesetResolver.forVisionTasks(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm'
        );

        const modelOpts = {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
            delegate: 'GPU',
          },
          runningMode: 'VIDEO',
          numHands: 1,
          minHandDetectionConfidence: 0.5,
          minHandPresenceConfidence: 0.5,
          minTrackingConfidence: 0.5,
        };

        try {
          handLandmarker = await HandLandmarker.createFromOptions(vision, modelOpts);
        } catch {
          modelOpts.baseOptions.delegate = 'CPU';
          handLandmarker = await HandLandmarker.createFromOptions(vision, modelOpts);
        }

        statusEl.textContent = 'Starting camera...';
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 1280, max: 1920 },
            height: { ideal: 720, max: 1080 },
            frameRate: { ideal: 60, min: 30 },
          },
          audio: false,
        });
        video.srcObject = stream;
        const track = stream.getVideoTracks()[0];
        if (track) {
          try { await track.applyConstraints({ frameRate: { ideal: 60 } }); } catch { /* ignore */ }
        }
        video.width = video.videoWidth || 1280;
        video.height = video.videoHeight || 720;
        await video.play();

        statusEl.textContent = 'Camera ready! Show your index finger, then click Start.';
        startBtn.disabled = false;
        startVideoTracking();
      } catch (err) {
        statusEl.textContent = err.name === 'NotAllowedError'
          ? 'Camera access denied. Please allow webcam access and reload.'
          : `Tracking failed: ${err.message}. Use http://localhost:8080`;
        console.error(err);
      }
    }

    startBtn.disabled = true;
    initTracking();
    requestAnimationFrame(gameLoop);
  </script>
</body>
